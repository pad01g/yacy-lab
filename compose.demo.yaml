# 手で触るためのデモ。YaCy 本家 3 ノードと改善版 6 ノード（信頼と NAT 越えの試験と同じ構成）を立て、
# 同じサイトを crawl させてから、ブラウザで両方の網に同じクエリを投げて比べる。
#   docker compose -f compose.demo.yaml -p yacydemo up -d
#   → http://localhost:8800 （準備の進み具合もここに出る。準備には 10 分ほどかかる）
#   各ノードの YaCy 管理画面も開くなら: docker compose -f compose.demo.yaml -f compose.demo.admin.yaml -p yacydemo up -d
#   （管理画面は既定のパスワード admin / yacy のまま。ほかの Web ページから DNS rebinding で操作されうるので、既定では公開しない）
#   docker compose -f compose.demo.yaml -p yacydemo down -v
# compose.trust.yaml と同じサブネットを使うので、信頼の試験と同時には動かせない。
#
#   pub 172.30.0.0/24:    lab / relay / fork-1..3 / ads-1 / evil-1 / router / demo
#   natlan 172.31.0.0/24: natbox（nat-1 と nat-1-p2p）/ router / demo
#   upnet:                lab / up-1..3 / demo

x-yacy: &yacy
  restart: unless-stopped
  entrypoint: ["/bin/sh", "/lab/entry.sh"]
  # heap 500 MB plus Solr / Lucene memory outside the heap: 900 MB was too little (a node was killed)
  mem_limit: 1100m
  logging:
    options:
      max-size: "20m"
      max-file: "2"

x-fork: &fork
  <<: *yacy
  image: ${FORK_IMAGE:-yacy-lab/fork:latest}
  environment:
    YACY_XMX: "500m"
  volumes: &fork-volumes
    - ./yacy/entry.sh:/lab/entry.sh:ro
    - ./yacy/yacy.trust.conf:/lab/yacy.conf:ro
    - ./yacy/yacy.network.trust.unit:/opt/yacy_search_server/defaults/yacy.network.lab.unit:ro

x-upstream: &upstream
  <<: *yacy
  image: ${UPSTREAM_IMAGE:-yacy-lab/upstream:baseline}
  environment:
    YACY_XMX: "500m"
  networks: [upnet]
  volumes:
    - ./yacy/entry.sh:/lab/entry.sh:ro
    - ./yacy/yacy.conf:/lab/yacy.conf:ro
    - ./yacy/yacy.network.upstream.unit:/opt/yacy_search_server/defaults/yacy.network.lab.unit:ro

x-sidecar: &sidecar
  image: ${SIDECAR_IMAGE:-yacy-lab/sidecar:latest}
  restart: unless-stopped
  user: "100:101"
  logging:
    options:
      max-size: "20m"
      max-file: "2"

services:
  lab:
    image: node:24-alpine
    working_dir: /app
    command: ["node", "--no-warnings", "lab/server.ts"]
    environment:
      CLUSTERS: "trust=fork-1,fork-2,fork-3,ads-1,evil-1;upstream=up-1,up-2,up-3"
    volumes:
      - ./lab:/app/lab:ro
    networks:
      pub:
        ipv4_address: 172.30.0.2
        aliases: [alpha.lab, beta.lab, gamma.lab, spam.lab, ads.lab, delta.lab, seed.lab]
      upnet:
        aliases: [alpha.lab, beta.lab, gamma.lab, spam.lab, ads.lab, seed.lab]

  demo:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "--no-warnings", "lab/demo.ts"]
    ports: ["127.0.0.1:8800:8800"]
    volumes:
      - ./lab:/app/lab:ro
      # コーディネータの鍵と一覧の状態（lab/demotrust.ts）。再起動しても同じ鍵を使う
      - demo_state:/state
    networks: [pub, natlan, upnet]

  relay:
    <<: *sidecar
    user: "1000:1000"
    command: ["-relay-service", "-relay-open", "-key", "/data/relay.key", "-key-create", "-reachability", "public", "-http", "0.0.0.0:8095", "-listen", "/ip4/0.0.0.0/tcp/4001"]
    volumes:
      - relay_key:/data
    networks:
      pub:
        ipv4_address: 172.30.0.3

  fork-1:
    <<: *fork
    networks:
      pub:
        ipv4_address: 172.30.0.11
  fork-1-p2p:
    <<: *sidecar
    network_mode: "service:fork-1"
    volumes_from: ["fork-1:ro"]
    command: ["-key", "/opt/yacy_search_server/DATA/SETTINGS/peer.key", "-token-file", "/opt/yacy_search_server/DATA/SETTINGS/sidecar.token", "-relay", "http://172.30.0.3:8095"]
  fork-2:
    <<: *fork
    networks:
      pub:
        ipv4_address: 172.30.0.12
  fork-2-p2p:
    <<: *sidecar
    network_mode: "service:fork-2"
    volumes_from: ["fork-2:ro"]
    command: ["-key", "/opt/yacy_search_server/DATA/SETTINGS/peer.key", "-token-file", "/opt/yacy_search_server/DATA/SETTINGS/sidecar.token", "-relay", "http://172.30.0.3:8095"]
  fork-3:
    <<: *fork
    networks:
      pub:
        ipv4_address: 172.30.0.13
  fork-3-p2p:
    <<: *sidecar
    network_mode: "service:fork-3"
    volumes_from: ["fork-3:ro"]
    command: ["-key", "/opt/yacy_search_server/DATA/SETTINGS/peer.key", "-token-file", "/opt/yacy_search_server/DATA/SETTINGS/sidecar.token", "-relay", "http://172.30.0.3:8095"]
  ads-1:
    <<: *fork
    environment:
      YACY_XMX: "500m"
      YACY_CONF: "trust.selfTags=ads"
    networks:
      pub:
        ipv4_address: 172.30.0.14
  evil-1:
    <<: *fork
    networks:
      pub:
        ipv4_address: 172.30.0.15

  router:
    image: alpine:3.22
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "1"
    command: ["sh", "-c", "apk add -q iptables && iptables -t nat -A POSTROUTING -s 172.31.0.0/24 ! -d 172.31.0.0/24 -j MASQUERADE && echo router ready && exec sleep infinity"]
    networks:
      pub:
        ipv4_address: 172.30.0.254
      natlan:
        ipv4_address: 172.31.0.254
  natbox:
    image: alpine:3.22
    cap_add: [NET_ADMIN]
    command: ["sh", "-c", "ip route replace default via 172.31.0.254 && echo natbox ready && exec sleep infinity"]
    extra_hosts:
      - "seed.lab:172.30.0.2"
      - "delta.lab:172.30.0.2"
    networks:
      natlan:
        ipv4_address: 172.31.0.10
  nat-1:
    <<: *fork
    network_mode: "service:natbox"
    environment:
      YACY_XMX: "500m"
      STATIC_IP: "172.31.0.10"
  nat-1-p2p:
    <<: *sidecar
    network_mode: "service:natbox"
    volumes_from: ["nat-1:ro"]
    command: ["-key", "/opt/yacy_search_server/DATA/SETTINGS/peer.key", "-token-file", "/opt/yacy_search_server/DATA/SETTINGS/sidecar.token", "-relay", "http://172.30.0.3:8095"]

  up-1:
    <<: *upstream
  up-2:
    <<: *upstream
  up-3:
    <<: *upstream

volumes:
  relay_key:
  demo_state:

networks:
  pub:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  natlan:
    ipam:
      config:
        - subnet: 172.31.0.0/24
  upnet:

# lab ノード共通の設定（defaults/yacy.init からの差分）
network.unit.definition=defaults/yacy.network.lab.unit
# 3 ノードを 1 台の Docker で動かすと load average が既定の閾値（solr 4.0 / rwi 8.0）を超え、
# リモート検索自体が送られなくなるので上げる
remotesearch.maxload.solr=100.0
remotesearch.maxload.rwi=100.0
# 他ピアから届いた結果を自ピアの索引へ保存しない（評価を繰り返しても索引が変わらないように）
remotesearch.result.store=false
# 他ピアの応答を待つ時間。フォーク版の既定は 5000 ms、upstream は 3000 ms なので、比較のため両方 3000 にそろえる
remotesearch.maxtime=3000
# 新規ピアしかいない網でも DHT（RWI）の remote 検索先に入れる。フォーク版だけが読むキー
remotesearch.dht.minage=0
# 閉じた網で全ノードを知っているので、コーディネータ無しで署名付きのピアをすべて信頼する（フォーク版だけが読む。
# 既定ではコーディネータが無いと自ピアの文書しか信頼しない）
trust.signedOnly=true
javastart_Xmx=Xmx600m
upnp.enabled=false
browserPopUpTrigger=false
adminAccountForLocalhost=false
update.process=manual

# upstream 版 3 ノードと改善版 3 ノードを、別々の閉じた P2P 網として同時に立てる。
#   lab:        コーパス（alpha.lab / beta.lab / gamma.lab）とブートストラップ用 seed list を配る
#   up-1..3:    upstream（yacy/yacy_search_server b50b76b + ビルド修正のみ）
#   fork-1..3:  改善版（pad01g/yacy_search_server improved-search）
#   runner:     crawl 開始・索引待ち・評価を行う（docker compose run --rm runner）
# ノード i はサイト i だけを crawl する。評価クエリは 1 番ノードに global で投げるので、
# 他ピアの結果を集められないと正解が揃わない。

x-yacy: &yacy
  restart: "no"
  entrypoint: ["/bin/sh", "/lab/entry.sh"]
  volumes:
    - ./yacy/entry.sh:/lab/entry.sh:ro
    - ./yacy/yacy.conf:/lab/yacy.conf:ro
  mem_limit: 1100m
  logging:
    options:
      max-size: "20m"
      max-file: "2"

x-upstream: &upstream
  <<: *yacy
  image: ${UPSTREAM_IMAGE:-yacy-lab/upstream:baseline}
  networks: [net-upstream]
  volumes:
    - ./yacy/entry.sh:/lab/entry.sh:ro
    - ./yacy/yacy.conf:/lab/yacy.conf:ro
    - ./yacy/yacy.network.upstream.unit:/opt/yacy_search_server/defaults/yacy.network.lab.unit:ro

x-fork: &fork
  <<: *yacy
  image: ${FORK_IMAGE:-yacy-lab/fork:latest}
  networks: [net-fork]
  volumes:
    - ./yacy/entry.sh:/lab/entry.sh:ro
    - ./yacy/yacy.conf:/lab/yacy.conf:ro
    - ./yacy/yacy.network.fork.unit:/opt/yacy_search_server/defaults/yacy.network.lab.unit:ro

services:
  lab:
    image: node:24-alpine
    working_dir: /app
    command: ["node", "--no-warnings", "lab/server.ts"]
    environment:
      CLUSTERS: "upstream=up-1,up-2,up-3;fork=fork-1,fork-2,fork-3"
    volumes:
      - ./lab:/app/lab:ro
    networks:
      net-upstream:
        aliases: [alpha.lab, beta.lab, gamma.lab, seed.lab]
      net-fork:
        aliases: [alpha.lab, beta.lab, gamma.lab, seed.lab]

  up-1:
    <<: *upstream
    ports: ["127.0.0.1:8190:8090"]
  up-2:
    <<: *upstream
  up-3:
    <<: *upstream

  fork-1:
    <<: *fork
    ports: ["127.0.0.1:8290:8090"]
  fork-2:
    <<: *fork
  fork-3:
    <<: *fork

  runner:
    image: node:24-alpine
    profiles: ["run"]
    working_dir: /app
    entrypoint: ["node", "--no-warnings", "lab/run.ts"]
    volumes:
      - ./lab:/app/lab:ro
      - ./results:/app/results
    networks: [net-upstream, net-fork]

networks:
  net-upstream:
  net-fork:

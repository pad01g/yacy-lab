# 信頼・NAT 試験のノード共通の設定（defaults/yacy.init からの差分）。yacy.conf に加えて sidecar を使う
network.unit.definition=defaults/yacy.network.lab.unit
remotesearch.maxload.solr=100.0
remotesearch.maxload.rwi=100.0
# peer ping（seed の交換）も load average が 4 を超えると止まる。多数のノードを同時に起動すると数分間 4 を超え、網がつながらない
30_peerping_loadprereq=100.0
remotesearch.result.store=false
# 他ピアの応答を待つ時間（フォーク版の既定は 5000 ms）。検索品質の実験（yacy.conf）とそろえる
remotesearch.maxtime=3000
remotesearch.dht.minage=0
p2p.sidecar.url=http://127.0.0.1:8095
javastart_Xmx=Xmx600m
upnp.enabled=false
browserPopUpTrigger=false
adminAccountForLocalhost=false
update.process=manual
